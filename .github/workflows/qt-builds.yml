name: Qt builds
on:
  push:
    branches: [main]
    paths: ['generator/**', 'scripts/**', 'examples/**', '.github/**', 'LAWS.bend', 'PROOF.bend', 'LICENSE']
  pull_request:
    paths: ['generator/**', 'scripts/**', 'examples/**', '.github/**', 'LAWS.bend', 'PROOF.bend', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  BEND_NO_TELEMETRY: '1'
  PYTHONUNBUFFERED: '1'
  BQT_SHARD_JOBS: '2'
  BQT_STATE_JOBS: '2'
  # Check timeouts are sized for a 32-core workstation running eight jobs.
  BQT_CHECK_TIMEOUT_SCALE: '6'
  LIBGL_ALWAYS_SOFTWARE: '1'
jobs:
  build:
    name: Qt ${{ matrix.qt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        qt: ['6.10.3', '6.11.3']
    env:
      QT_VERSION: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qt-toolchain
        with:
          qt-version: ${{ matrix.qt }}
      - name: Prepare corresponding sources, notices and runtime manifest
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" prepare
      - name: Generate and compile complete distribution
        run: nice -n 10 python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" generate
      - name: Validate fresh native consumers
        # Qt's offscreen platform creates OpenGL contexts through GLX, so the
        # GL and scene graph fixtures need an X server even when headless.
        run: >-
          xvfb-run -a -s '-screen 0 1280x1024x24'
          nice -n 10 python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" verify
      - name: Package validated build
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" artifact
      - name: Collect diagnostics
        if: always()
        run: |
          sudo dmesg --ctime | tail -n 300 > build/ci-monitor/kernel.log || true
          python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" diagnostics
      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bend-qt-${{ matrix.qt }}-${{ github.run_attempt }}
          path: build/ci-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The complete Qt 6.12 gate needs more memory and time than one standard
  # runner has. One runner generates the package that the checks below test in
  # parallel; another generates the same inputs to check determinism.
  generate-612:
    name: Qt 6.12.0 generation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      QT_VERSION: '6.12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qt-toolchain
        with:
          qt-version: '6.12.0'
      - name: Prepare corresponding sources, notices and runtime manifest
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" prepare
      - name: Generate and compile complete distribution
        run: nice -n 10 python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" generate
      - name: Record the generation for the checks
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" --role tested state
      - name: Upload generated package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-6.12.0-package
          path: |
            build/ci-state/package.tar.zst
            build/ci-state/generation.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true
      - name: Upload generation work
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-6.12.0-work
          path: build/ci-state/work.tar.zst
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true
      - name: Collect diagnostics
        if: failure()
        run: |
          sudo dmesg --ctime | tail -n 300 > build/ci-monitor/kernel.log || true
          python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" diagnostics
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-6.12.0-generation-${{ github.run_attempt }}
          path: build/ci-artifacts/*
          retention-days: 7
          compression-level: 0

  regenerate-612:
    name: Qt 6.12.0 independent generation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      QT_VERSION: '6.12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qt-toolchain
        with:
          qt-version: '6.12.0'
      - name: Prepare corresponding sources, notices and runtime manifest
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" prepare
      - name: Generate and compile complete distribution
        run: nice -n 10 python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" generate
      - name: Record the generation digest
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" --role independent state
      - name: Upload generation digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-6.12.0-independent-generation
          path: build/ci-state/generation.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Collect diagnostics
        if: failure()
        run: |
          sudo dmesg --ctime | tail -n 300 > build/ci-monitor/kernel.log || true
          python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" diagnostics
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-6.12.0-independent-generation-${{ github.run_attempt }}
          path: build/ci-artifacts/*
          retention-days: 7
          compression-level: 0

  check-612:
    name: Qt 6.12.0 ${{ matrix.part }}
    needs: generate-612
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Every part of scripts/check-qt612.py except regeneration, which the
        # independent generation replaces.
        part: [consumers, runtime, native, conversions, callbacks, signals, extension]
    env:
      QT_VERSION: '6.12.0'
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qt-toolchain
        with:
          qt-version: '6.12.0'
      - name: Download generated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qt-6.12.0-package
          path: build/ci-state
      - name: Download generation work
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qt-6.12.0-work
          path: build/ci-state
      - name: Restore the generation
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" restore
      # list-models once aborted here on a qFatal from a QJSEngine constructed
      # without an application, which no workstation run reproduces. Report a
      # backtrace with fatal Qt messages; other messages keep Qt's format.
      - name: Report fatal Qt messages with a backtrace
        if: matrix.part == 'callbacks'
        run: >-
          echo 'QT_MESSAGE_PATTERN=%{if-category}%{category}: %{endif}%{message}%{if-fatal}
          [backtrace %{backtrace depth=48 separator=" < "}]%{endif}' >> "$GITHUB_ENV"
      - name: Check
        run: >-
          xvfb-run -a -s '-screen 0 1280x1024x24'
          nice -n 10 python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" verify --part "$PART"
      - name: Upload part receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-6.12.0-part-${{ matrix.part }}
          path: build/qt612/check/parts/${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Collect diagnostics
        if: always()
        run: |
          sudo dmesg --ctime | tail -n 300 > build/ci-monitor/kernel.log || true
          python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" diagnostics
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-6.12.0-${{ matrix.part }}-${{ github.run_attempt }}
          path: build/ci-artifacts/*
          retention-days: 7
          compression-level: 0

  verdict-612:
    name: Qt 6.12.0
    needs: [check-612, regenerate-612]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_VERSION: '6.12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download generated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qt-6.12.0-package
          path: build/ci-state
      - name: Download independent generation digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qt-6.12.0-independent-generation
          path: build/ci-state/independent
      - name: Download part receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qt-6.12.0-part-*
          path: build/qt612/check/parts
          merge-multiple: true
      - name: Restore the generated package
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" restore
      - name: Combine the canonical gate
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" verdict
      - name: Package validated build
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" artifact
      - name: Collect diagnostics
        if: always()
        run: python3 scripts/ci-qt-build.py --qt-version "$QT_VERSION" diagnostics
      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bend-qt-6.12.0-${{ github.run_attempt }}
          path: build/ci-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
